name: probe-archive
on:
  push:
    branches: [probe-archive]
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          exec > probe.txt 2>&1
          set +e
          B=https://waterlevel.ie/hydro-data
          curl -sS $B/assets/index.8130a0e1.js -o b.js
          grep -o '.\{200\}[Qq]uality.\{300\}' b.js | head -30
          for f in conf/config.json config.json data/internet/layers/conf.json data/internet/qualitycodes.json; do echo "== $f"; curl -sS -w " %{http_code}\n" $B/$f | head -c 1500; done
          for n in 26027 26085 25056; do echo "== $n"; curl -sS $B/data/internet/stations/0/$n/S/year.json | head -c 400; echo; done
      - name: Save
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -f probe.txt || true
          git commit -m "probe output [skip ci]" || true
          git pull --rebase -q || true
          git push
