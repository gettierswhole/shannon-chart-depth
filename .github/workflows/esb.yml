name: Update ESB Lough Derg levels
# The ESB publish one 09:00 level a day for Pier Head (Killaloe) and Portumna Bridge, in chart PDFs that are
# renewed about midday. tools/update_esb.py reads the two files and keeps every day seen in esb.json.
# GitHub often starts scheduled runs hours late or not at all, so several are asked for; a run that finds
# nothing new changes nothing.
on:
  schedule:
    - cron: "41 11,13,15,18,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/esb.yml", "tools/update_esb.py"]
permissions:
  contents: write
concurrency:
  group: esb-json
  cancel-in-progress: false
jobs:
  esb:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the ESB files
        id: read
        # A gauge that cannot be read is left as it was; the step still fails at the end so the run shows red.
        run: python3 tools/update_esb.py esb.json
        continue-on-error: true
      - name: Commit if changed
        run: |
          git add esb.json
          if git diff --cached --quiet; then echo "No new readings"; else
            git config user.name "gauge-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Update ESB Lough Derg levels" esb.json
            ok=0
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && ok=1 && break; sleep 5; done
            [ "$ok" = 1 ] || exit 1
          fi
      - name: Fail if a file could not be read
        if: steps.read.outcome == 'failure'
        run: exit 1
