name: Check marine notices
# One visit an hour at most to Waterways Ireland's marine notices: the list of live notices, then the pages of the
# Shannon notices on it that are new or changed (see tools/check_notices.py). By their Inspector's written permission.
# By day the scheduled task "Shannon notices check" starts this job once an hour (workflow_dispatch). The schedule
# below covers the night. The script keeps the visits an hour apart whoever starts it: a start in the last quarter
# of the hour waits it out, an earlier one does nothing.
on:
  schedule:
    - cron: "23 23,0-5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notices
  cancel-in-progress: false
jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Read the marine notices
        run: python3 tools/check_notices.py notices_site.json
      - name: Commit if changed
        run: |
          [ -f notices_site.json ] || exit 0
          git add notices_site.json
          if [ -f tools/wi_intermediate.pem ]; then git add tools/wi_intermediate.pem; fi
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git config user.name "gauge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Check marine notices"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 7; done
          exit 1
