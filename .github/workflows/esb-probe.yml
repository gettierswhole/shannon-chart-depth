name: ESB probe (temporary)
on:
  push:
    branches: [esb-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Text in the two flow files
        run: |
          for f in 07-Total-Ardnacrusha-Flow 08-Total-Parteen-Weir-Flow; do
            curl -sS -o "$f.pdf" -A "shannon-chart-depth (github.com/gettierswhole/shannon-chart-depth)" "http://www.esbhydro.ie/Shannon/$f.pdf"
            echo "=== $f $(stat -c %s $f.pdf)"
            python3 - "$f.pdf" <<'PY'
          import sys, re
          sys.path.insert(0, "tools")
          import update_esb as u
          n = 0
          for raw in u.streams(open(sys.argv[1], "rb").read()):
              c = raw.decode("latin-1")
              if "TJ" not in c and "Tj" not in c: continue
              cs = u.chunks(c)
              print("-- stream with", len(cs), "chunks")
              for x, y, t in cs[:14] + cs[-46:]:
                  print("%7.2f %7.2f %r" % (x, y, t[:90]))
          PY
          done
