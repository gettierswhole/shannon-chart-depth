name: ESB probe (temporary)
on:
  push:
    branches: [esb-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run the reader
        run: |
          python3 tools/update_esb.py esb.json
          python3 - <<'PY'
          import json
          d = json.load(open("esb.json"))
          for k in ("pierHead", "portumna"):
              g = d[k]; print(k, g["level"], g["time"], len(g["history"]))
              print(" ".join("%s=%.2f" % (p["t"][5:10], p["v"]) for p in g["history"]))
          print(d["units"]); print(len(open("esb.json").read()), "bytes")
          PY
      - name: Words on the Pier Head pages
        run: |
          curl -sS -o ph.pdf -A "shannon-chart-depth (github.com/gettierswhole/shannon-chart-depth)" http://www.esbhydro.ie/Shannon/06-Pier-Head-Killaloe.pdf
          python3 - <<'PY'
          import sys, re
          sys.path.insert(0, "tools")
          import update_esb as u
          for raw in u.streams(open("ph.pdf", "rb").read()):
              c = raw.decode("latin-1")
              if "TJ" not in c: continue
              for x, y, t in u.chunks(c):
                  if re.search(r"[A-Za-z]{3}", t) and not u.STAMP.match(t): print(repr(t[:400]))
          PY
