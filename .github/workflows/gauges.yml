name: Update gauges
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/gauges.yml", "tools/update_gauges.py", "tools/update_weather.py"]
permissions:
  contents: write
concurrency:
  group: data-json
  cancel-in-progress: false
jobs:
  gauges:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OPW gauges
        run: python3 tools/update_gauges.py data.json
      - name: Fetch Met Éireann lakes forecast
        # A failed forecast fetch must not stop the gauges: the page flags a forecast over 18 hours old.
        run: python3 tools/update_weather.py data.json || echo "Forecast fetch failed; keeping the last one"
      - name: Commit if changed
        run: |
          if git diff --quiet data.json; then echo "No new readings"; exit 0; fi
          git config user.name "gauge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update gauges and forecast" data.json
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 5; done
          exit 1
      - name: Make the page files
        # The small files the public pages load (tools/slim_data.py). Made here because this job's push
        # doesn't start the "Make page files" workflow.
        run: |
          git config user.name "gauge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 tools/slim_data.py data.json .
            git add live.json food-*.json history-*.json
            if git diff --cached --quiet; then echo "Page files up to date"; exit 0; fi
            git commit -q -m "Update page files"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
